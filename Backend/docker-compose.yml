services:
  postgres:
    image: postgres:16-alpine
    container_name: myits-recap-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: myits_recap
    ports:
      - "5432:5432"
    volumes:
      - myits_postgres_data:/var/lib/postgresql/data

volumes:
  myits_postgres_data:
